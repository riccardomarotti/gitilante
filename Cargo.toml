[package]
name = "gitilante"
version = "0.1.2"
edition = "2024"
description = "A lightweight GUI for viewing Git and manipulating hunks"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[dependencies]
async-channel = "2.5.0"
env_logger = "0.11"
gtk4 = "0.11"
libadwaita = { version = "0.9", features = ["v1_5"] }
log = "0.4"

[profile.dev]
# Faster debug builds; only affects debug info.
debug = 1
