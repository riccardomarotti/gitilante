# Release pipeline for Gitilante.
#
# Branch pushes run the checks and the build; a release tag vX.Y.Z additionally
# generates the AUR package metadata and really builds the Arch package.
# Publishing to the AUR (added later) must only ever happen from a valid
# release tag and only after every stage here has succeeded (see DEPLOY.md).
#
# The pipeline orchestrates the scripts in scripts/: keep the logic there, not
# here, so it stays testable outside of GitLab CI.

stages:
  - check
  - test
  - build
  - package
  - publish

default:
  image: archlinux:base-devel
  interruptible: true

# Release tags only: vMAJOR.MINOR.PATCH.
.release:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

# Branch pushes and any tag.
.checks:
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

.install-deps:
  before_script:
    - pacman -Syu --noconfirm --needed git gtksourceview5 rust gtk4 libadwaita xorg-server-xvfb

check-version:
  stage: check
  extends: .release
  script:
    - scripts/check-version.sh "$CI_COMMIT_TAG"

test:
  stage: test
  extends: [.checks, .install-deps]
  script:
    - echo "Running tests..."
    - cargo fetch --locked
    - xvfb-run -a cargo test --frozen

build:
  stage: build
  extends: [.checks, .install-deps]
  script:
    - echo "Building Gitilante..."
    - cargo fetch --locked
    - cargo build --frozen --release
  artifacts:
    paths:
      - target/release/gitilante
    expire_in: 1 day

# Generates the AUR package metadata and really builds the Arch package in a
# clean Arch environment: dependency resolution must be verified too.
package:
  stage: package
  extends: [.release, .install-deps]
  needs: [check-version, test, build]
  script:
    - echo "Generating PKGBUILD..."
    - echo "Generating .SRCINFO..."
    - echo "Testing Arch package..."
    # makepkg (including --printsrcinfo) refuses to run as root: generate the
    # metadata and build the package as an unprivileged user.
    - useradd -m builder
    - chown -R builder:builder .
    - su builder -c "scripts/generate-aur-package.sh '${CI_COMMIT_TAG#v}' --pkgrel 1 && cd dist/aur && makepkg --noconfirm"
  artifacts:
    paths:
      - dist/aur/PKGBUILD
      - dist/aur/.SRCINFO
      - dist/aur/*.pkg.tar.zst
    expire_in: 1 month

# Updates the AUR package from the metadata built in the package job. Only a
# valid release tag gets here, and only after every check has succeeded
# (DEPLOY.md section 20). The AUR SSH key comes from the protected masked
# variable AUR_SSH_PRIVATE_KEY (section 13).
publish-aur:
  stage: publish
  extends: .release
  needs: [check-version, test, build, package]
  before_script:
    - pacman -Syu --noconfirm --needed git openssh
  script:
    - echo "Publishing AUR..."
    - scripts/publish-aur.sh

# Builds the official binary bundle from the build job binary, publishes it to
# the GitLab Generic Package Registry and really builds the binary package
# (BINPACKAGE.md sections 6-27). The runtime libraries are needed to verify the
# binary with ldd and to resolve the PKGBUILD depends for makepkg.
package-bin:
  stage: package
  extends: .release
  needs: [check-version, test, build]
  before_script:
    - pacman -Syu --noconfirm --needed curl git gtksourceview5 gtk4 libadwaita
  script:
    - V="${CI_COMMIT_TAG#v}"
    - echo "Building binary bundle..."
    - scripts/build-binary-bundle.sh "$V"
    - echo "Publishing binary bundle..."
    - scripts/publish-binary-bundle.sh "$V"
    - echo "Generating PKGBUILD (gitilante-bin)..."
    - echo "Generating .SRCINFO (gitilante-bin)..."
    - echo "Testing Arch binary package..."
    # makepkg refuses to run as root (see the package job).
    - useradd -m builder
    - chown -R builder:builder .
    - su builder -c "scripts/generate-aur-bin-package.sh '$V' && cd dist/aur-bin && makepkg --noconfirm"
  artifacts:
    paths:
      - dist/bin/*.tar.gz
      - dist/aur-bin/PKGBUILD
      - dist/aur-bin/.SRCINFO
      - dist/aur-bin/*.pkg.tar.zst
    expire_in: 1 month

# Updates the binary AUR package from the metadata built in the package-bin
# job (BINPACKAGE.md section 28). It inherits the idempotence and the SSH
# handling of publish-aur.sh.
publish-aur-bin:
  stage: publish
  extends: .release
  needs: [check-version, test, build, package-bin]
  before_script:
    - pacman -Syu --noconfirm --needed git openssh
  script:
    - echo "Publishing AUR (gitilante-bin)..."
    - AUR_PACKAGE=gitilante-bin AUR_METADATA_DIR=dist/aur-bin scripts/publish-aur.sh
